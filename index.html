<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>daniel bultas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="daniel bultas — research, data, machine learning. catchcake.">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a0a0a; color: #e8e8e8; overflow: hidden;
    font: 11px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.12em; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  footer { position: fixed; left: 0; right: 0; bottom: 28px;
    display: flex; gap: 18px; justify-content: center; align-items: center;
    pointer-events: none; }
  footer a, footer span { color: #e8e8e8; text-decoration: none;
    display: inline-flex; align-items: center; opacity: 0.55;
    transition: opacity .25s ease; pointer-events: auto; }
  footer a:hover { opacity: 1; }
  footer svg { width: 14px; height: 14px; }
  .sep { width: 4px; height: 4px; background: currentColor; border-radius: 50%; opacity: 0.3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<footer>
  <span>daniel bultas</span>
  <span class="sep" aria-hidden="true"></span>
  <a href="https://github.com/bultas" aria-label="GitHub" rel="me">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.05c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.27-1.69-1.27-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.76 2.69 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.27-5.24-5.65 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.15 1.17a10.93 10.93 0 0 1 5.74 0c2.19-1.48 3.15-1.17 3.15-1.17.62 1.57.23 2.73.11 3.02.74.8 1.18 1.82 1.18 3.07 0 4.39-2.7 5.36-5.27 5.64.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
  </a>
  <a href="https://twitter.com/bultas" aria-label="Twitter / X" rel="me">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </a>
</footer>
<script>
(() => {
  const cnv = document.getElementById('c');
  const ctx = cnv.getContext('2d');
  let W, H, DPR;
  const resize = () => {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cnv.width = innerWidth * DPR;
    H = cnv.height = innerHeight * DPR;
  };
  resize();
  addEventListener('resize', resize);

  const N = innerWidth < 700 ? 140 : 260;
  const K = 5;
  const palette = ['#e8e8e8','#a8d8ff','#ffd6a5','#caffbf','#ffadad'];

  // life === null → immortal baseline; life ∈ (0,1] → mortal child that fades + dies
  const LIFESPAN = 360; // ≈ 6s @ 60fps
  const MAX_MORTALS = innerWidth < 700 ? 60 : 120;
  let mortalCount = 0;
  const ps = Array.from({length: N}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    vx: 0, vy: 0, c: 0, aura: 0, life: null
  }));

  // pre-built strokeStyle strings, bucketed by alpha → eliminates per-line string allocation
  const A_BUCKETS = 24;
  const NET_STROKE = new Array(A_BUCKETS);
  const AURA_STROKE = new Array(A_BUCKETS);
  const FLASH_STROKE = new Array(A_BUCKETS);
  for (let i = 0; i < A_BUCKETS; i++) {
    const t = (i + 1) / A_BUCKETS;
    NET_STROKE[i]   = `rgba(232,232,232,${t * 0.22})`;
    AURA_STROKE[i]  = `rgba(232,232,232,${t * 0.40})`;
    FLASH_STROKE[i] = `rgba(232,232,232,${t * 0.70})`;
  }
  // line buckets — collected each frame, drawn batched, then truncated
  const netBuckets  = Array.from({length: A_BUCKETS}, () => []);
  const auraBuckets = Array.from({length: A_BUCKETS}, () => []);
  let cs = [];
  const seed = () => {
    cs = Array.from({length: K}, () => ({ x: Math.random()*W, y: Math.random()*H }));
  };
  seed();

  // mouse / hover state
  let mx = -1e6, my = -1e6;
  cnv.addEventListener('pointermove', (e) => { mx = e.clientX*DPR; my = e.clientY*DPR; });
  cnv.addEventListener('pointerleave', () => { mx = my = -1e6; });

  // explosion flashes — short-lived radial rings
  const flashes = [];

  let frame = 0;
  const step = () => {
    // 0. decay mortals; remove when life expires
    for (let i = ps.length - 1; i >= 0; i--) {
      if (ps[i].life !== null) {
        ps[i].life -= 1 / LIFESPAN;
        if (ps[i].life <= 0) { ps.splice(i, 1); mortalCount--; }
      }
    }

    // 1. assign each point to nearest centroid
    for (const p of ps) {
      let best = 0, bd = Infinity;
      for (let k = 0; k < K; k++) {
        const dx = p.x - cs[k].x, dy = p.y - cs[k].y;
        const d = dx*dx + dy*dy;
        if (d < bd) { bd = d; best = k; }
      }
      p.c = best;
    }

    // 2. update centroids toward cluster mean (smoothed k-means step)
    if (frame % 18 === 0) {
      const sums = Array.from({length: K}, () => ({x:0,y:0,n:0}));
      for (const p of ps) { sums[p.c].x += p.x; sums[p.c].y += p.y; sums[p.c].n++; }
      for (let k = 0; k < K; k++) {
        if (sums[k].n > 0) {
          cs[k].x = cs[k].x*0.86 + (sums[k].x/sums[k].n)*0.14;
          cs[k].y = cs[k].y*0.86 + (sums[k].y/sums[k].n)*0.14;
        }
      }
    }

    // 3. drift particles toward their centroid + a touch of noise
    //    + mouse aura: nearby particles light up and gently part for the cursor
    const auraR = 130 * DPR, auraR2 = auraR * auraR;
    for (const p of ps) {
      const c = cs[p.c];
      p.vx = p.vx*0.94 + (c.x - p.x)*0.0008;
      p.vy = p.vy*0.94 + (c.y - p.y)*0.0008;

      const mdx = p.x - mx, mdy = p.y - my;
      const md2 = mdx*mdx + mdy*mdy;
      p.aura = md2 < auraR2 ? 1 - md2/auraR2 : 0;
      if (p.aura > 0) {
        const md = Math.sqrt(md2) + 0.001;
        p.vx += (mdx/md) * p.aura * 0.35;
        p.vy += (mdy/md) * p.aura * 0.35;
      }

      p.x += p.vx + (Math.random()-0.5)*0.5*DPR;
      p.y += p.vy + (Math.random()-0.5)*0.5*DPR;

      // bounce off viewport edges with slight energy loss
      const PAD = 2 * DPR;
      if (p.x < PAD)        { p.x = PAD;       p.vx = -p.vx * 0.72; }
      else if (p.x > W-PAD) { p.x = W-PAD;     p.vx = -p.vx * 0.72; }
      if (p.y < PAD)        { p.y = PAD;       p.vy = -p.vy * 0.72; }
      else if (p.y > H-PAD) { p.y = H-PAD;     p.vy = -p.vy * 0.72; }
    }

    // 4. trail fade
    ctx.fillStyle = 'rgba(10,10,10,0.14)';
    ctx.fillRect(0, 0, W, H);

    // 5. edges within cluster — collect into alpha buckets, then batch-stroke
    ctx.lineWidth = 1;
    const R = 95 * DPR;
    const R2 = R*R;
    const len = ps.length;
    for (let i = 0; i < len; i++) {
      const pi = ps[i];
      for (let j = i+1; j < len; j++) {
        const pj = ps[j];
        if (pi.c !== pj.c) continue;
        const dx = pi.x - pj.x, dy = pi.y - pj.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < R2) {
          const t = 1 - d2/R2;
          const b = t >= 1 ? A_BUCKETS-1 : (t * A_BUCKETS) | 0;
          const arr = netBuckets[b];
          arr.push(pi.x, pi.y, pj.x, pj.y);
        }
      }
    }
    for (let b = 0; b < A_BUCKETS; b++) {
      const arr = netBuckets[b];
      if (arr.length === 0) continue;
      ctx.strokeStyle = NET_STROKE[b];
      ctx.beginPath();
      for (let k = 0; k < arr.length; k += 4) {
        ctx.moveTo(arr[k], arr[k+1]);
        ctx.lineTo(arr[k+2], arr[k+3]);
      }
      ctx.stroke();
      arr.length = 0;
    }

    // 6. cursor field — bucketed too
    if (mx > -1e5) {
      for (const p of ps) {
        if (p.aura > 0.05) {
          const b = p.aura >= 1 ? A_BUCKETS-1 : (p.aura * A_BUCKETS) | 0;
          auraBuckets[b].push(mx, my, p.x, p.y);
        }
      }
      for (let b = 0; b < A_BUCKETS; b++) {
        const arr = auraBuckets[b];
        if (arr.length === 0) continue;
        ctx.strokeStyle = AURA_STROKE[b];
        ctx.beginPath();
        for (let k = 0; k < arr.length; k += 4) {
          ctx.moveTo(arr[k], arr[k+1]);
          ctx.lineTo(arr[k+2], arr[k+3]);
        }
        ctx.stroke();
        arr.length = 0;
      }
    }

    // 7. points (radius + brightness boosted by aura → "alive" hint;
    //    mortal children fade as their life ticks down)
    for (const p of ps) {
      const lifeAlpha = p.life === null ? 1 : p.life;
      ctx.fillStyle = palette[p.c % palette.length];
      ctx.globalAlpha = (0.75 + p.aura * 0.25) * lifeAlpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (1.5 + p.aura*2.2) * DPR, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 8. explosion flash rings (bucketed strokeStyle)
    if (flashes.length) ctx.lineWidth = 1.4;
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= 0.035;
      if (f.life <= 0) { flashes.splice(i, 1); continue; }
      const b = f.life >= 1 ? A_BUCKETS-1 : (f.life * A_BUCKETS) | 0;
      ctx.strokeStyle = FLASH_STROKE[b];
      ctx.beginPath();
      ctx.arc(f.x, f.y, (1 - f.life) * 44 * DPR, 0, Math.PI*2);
      ctx.stroke();
    }

    frame++;
    requestAnimationFrame(step);
  };
  step();

  // click on particle = explode into children (auraR is the forgiving hit zone)
  // click on empty space = re-seed centroids + radial perturbation
  cnv.addEventListener('pointerdown', (e) => {
    const cx = e.clientX * DPR, cy = e.clientY * DPR;
    const hitR2 = (28 * DPR) * (28 * DPR);
    let hit = -1, bd = hitR2;
    for (let i = 0; i < ps.length; i++) {
      const dx = ps[i].x - cx, dy = ps[i].y - cy;
      const d2 = dx*dx + dy*dy;
      if (d2 < bd) { bd = d2; hit = i; }
    }

    if (hit >= 0) {
      const parent = ps[hit];
      const px = parent.x, py = parent.y, pc = parent.c;
      const parentMortal = parent.life !== null;
      flashes.push({ x: px, y: py, life: 1 });

      // chain detonation: remove parent first if it was a mortal
      if (parentMortal) { ps.splice(hit, 1); mortalCount--; }

      const children = 5;
      for (let k = 0; k < children; k++) {
        // if at mortal cap, evict the OLDEST mortal (immortals untouched)
        if (mortalCount >= MAX_MORTALS) {
          for (let m = 0; m < ps.length; m++) {
            if (ps[m].life !== null) { ps.splice(m, 1); mortalCount--; break; }
          }
        }
        const ang = (k / children) * Math.PI * 2 + Math.random() * 0.6;
        const speed = (3 + Math.random() * 4) * DPR;
        ps.push({
          x: px, y: py,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          c: pc, aura: 0, life: 1
        });
        mortalCount++;
      }
    } else {
      seed();
      for (const p of ps) {
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.hypot(dx, dy) + 0.001;
        const f = Math.min(140*DPR / d, 10);
        p.vx += (dx/d) * f;
        p.vy += (dy/d) * f;
      }
    }
  });
})();
</script>
</body>
</html>
